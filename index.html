<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Флексбоксы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="layout-1">
        <div class="container">
            <div class="column">
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
            </div>
            <div class="column">
                <div class="box">4</div>
            </div>
            <div class="column">
                <div class="box">5</div>
            </div>
        </div>
    </section>

    <section class="layout-2">
        <div class="container">
            <div class="column">
                <div class="box">
                    <div class="header">Рисунок 1</div>
                    <img src="https://picsum.photos/id/29/400/300">
                </div>
                <div class="box">
                    <div class="header">Рисунок 2</div>
                    <img src="https://picsum.photos/id/15/400/300">
                </div>
                <div class="box">
                    <div class="header">Рисунок 3</div>
                    <img src="https://picsum.photos/id/28/400/300">
                </div>
            </div>

            <div class="column">
                <div class="box">
                    <div class="header">Рисунок 4</div>
                    <img src="https://picsum.photos/id/1018/600/900">
                </div>
            </div>

            <div class="column">
                <div class="box">
                    <div class="header">Рисунок 5</div>
                    <img src="https://picsum.photos/id/1015/600/900">
                </div>
            </div>
        </div>
    </section>

</body>
</html>
